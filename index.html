
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una disculpita para Marcita 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffeaf2, #e9d5ff);
      color: #854568;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 410px;
      padding: 35px 25px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 15px 45px rgba(185, 105, 151, 0.22);
      text-align: center;
      z-index: 2;
      animation: appear 0.8s ease;
    }

    .main-heart {
      font-size: 58px;
      margin-bottom: 10px;
      animation: heartbeat 1.5s infinite;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 18px;
      color: #d94f91;
    }

    #mainText {
      font-size: 20px;
      line-height: 1.6;
      min-height: 90px;
      margin: 18px 0;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.7;
      color: #986782;
      margin: 12px 0 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      min-height: 55px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 13px 21px;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #yesBtn {
      background: #f28bb9;
      color: white;
      box-shadow: 0 5px 14px rgba(242, 139, 185, 0.3);
    }

    #noBtn {
      background: #f5e5ee;
      color: #a65d83;
    }

    #emojiContainer {
      font-size: 28px;
      margin: 15px 0;
      line-height: 1.8;
    }

    .hidden {
      display: none;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #bb8aa5;
    }

    .floating-heart {
      position: fixed;
      bottom: -40px;
      font-size: 22px;
      pointer-events: none;
      z-index: 1;
      animation: floatUp linear forwards;
      opacity: 0.8;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      to {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
      }
    }

    @media (max-width: 400px) {
      .card {
        padding: 28px 18px;
      }

      h1 {
        font-size: 24px;
      }

      #mainText {
        font-size: 18px;
      }

      button {
        padding: 12px 17px;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="main-heart">💗</div>

    <h1>Para mi Marcita bonita</h1>

    <div id="mainText">
      Marcita bonita, ¿me perdonas? 🥺💗
    </div>

    <p class="subtitle" id="subtitle">
      Te hice esta pequeña sorpresita porque quiero pedirte perdón
      y recordarte lo muchísimo que te amo. 💌
    </p>

    <div id="emojiContainer" class="hidden"></div>

    <div class="buttons" id="buttonsContainer">
      <button id="yesBtn">Sí, te perdono 💗</button>
      <button id="noBtn">Todavía no 😾</button>
    </div>

    <footer id="footerText">
      Hecho con cariño, especialmente para ti. 🌷
    </footer>
  </main>

  <script>
    const mainText = document.getElementById("mainText");
    const subtitle = document.getElementById("subtitle");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttonsContainer = document.getElementById("buttonsContainer");
    const emojiContainer = document.getElementById("emojiContainer");
    const footerText = document.getElementById("footerText");

    const sorryMessages = [
      "Marcita bonita, ¿me perdonas? 🥺💗",
      "Perdón por dejarte esperando para jugar Roblox. 😭💕",
      "Estaba esperando que mi papá se fuera y me ganó el sueño. 🥹",
      "Cuando desperté, te escribí porque todavía quería jugar contigo. 💗",
      "Pero nuestros horarios terminaron haciendo de las suyas. 😭🎮",
      "Me da penita que te hayas quedado esperando por mí. 🥺",
      "Nunca quise hacerte sentir ignorada, mi niña bonita. 💌",
      "De verdad tenía muchas ganas de compartir ese ratito contigo. 🎀",
      "Al final te debía una partida y terminé debiéndote una disculpa. 😭",
      "Ojalá hubiera podido organizarme mejor para no hacerte esperar. 💗",
      "Disfruto mucho los momentos que compartimos, incluso cuando solo jugamos. 🧸",
      "Hasta una partida de Roblox se vuelve especial cuando la comparto contigo. 🎮💕",
      "Perdón por quedarme dormido justo cuando queríamos jugar. 🥹",
      "La próxima vez quiero organizarme mejor para que podamos disfrutar sin apuros. 🌷",
      "No quería que terminaras la noche molesta conmigo. 💖",
      "Me encanta tenerte en mis días, incluso cuando solo hablamos un ratito. 💌",
      "Gracias por las risas, las conversaciones y cada momento que compartimos. 🫶",
      "Eres una personita muy especial para mí, Marcita. 💗",
      "Quiero seguir creando recuerdos bonitos contigo, poquito a poquito. 🌸",
      "No siempre me salen las cosas bien, pero quiero aprender de mis errores. 🥺",
      "Quiero demostrarte con mis acciones lo mucho que me importas. 💕",
      "Ojalá pudiera darte un abrazo y pedirte perdón en persona. 🫂",
      "Prometo poner más atención a nuestros horarios para no dejarte esperando. 🎮",
      "Y sí, todavía tenemos una partidita pendiente JAJAJA. 😭💗",
      "Quiero recuperar ese ratito contigo y hacer que sea bonito. 🧸",
      "Gracias por tomarte el tiempo de leer esta pequeña disculpa. 💌",
      "Espero que podamos volver a reírnos juntos muy pronto. 🌷",
      "Te mando un abrazo enorme, mi niña bonita. 💖",
      "Nunca olvides lo muchísimo que te amo, Marcita. 🥹💕",
      "Con mucho cariño, de alguien que te ama y todavía te debe una partida. 💗🎮"
    ];

    let messageIndex = 0;
    let noMoves = 0;

    function showNextMessage() {
      if (messageIndex < sorryMessages.length - 1) {
        messageIndex++;
      } else {
        messageIndex = 0;
      }

      mainText.textContent = sorryMessages[messageIndex];
    }

    function moveNoButton() {
      noMoves++;
      showNextMessage();

      const padding = 15;
      const maxX = Math.max(
        padding,
        window.innerWidth - noBtn.offsetWidth - padding
      );
      const maxY = Math.max(
        padding,
        window.innerHeight - noBtn.offsetHeight - padding
      );

      noBtn.style.position = "fixed";
      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
      noBtn.style.zIndex = "10";

      if (noMoves >= 3) {
        noBtn.textContent = "¿Segurita? 🥺";
      }

      if (noMoves >= 6) {
        noBtn.textContent = "Dame una oportunidad 💗";
      }
    }

    noBtn.addEventListener("mouseenter", moveNoButton);

    noBtn.addEventListener("click", function () {
      moveNoButton();
    });

    yesBtn.addEventListener("click", function () {
      mainText.innerHTML =
        "¡AY, MARCITA! 🥹💗<br>" +
        "Gracias por leer mi disculpita, mi niña bonita.";

      subtitle.textContent =
        "Te amo muchísimo, más de lo que a veces sé expresar. " +
        "Gracias por formar parte de mis días y regalarme momentos bonitos. " +
        "Quiero seguir compartiendo risas, juegos y muchos recuerdos contigo. 💌";

      emojiContainer.innerHTML = "💗 🧸 🎮 🌷 ✨ 💌";
      emojiContainer.classList.remove("hidden");

      buttonsContainer.style.display = "none";
      noBtn.style.display = "none";

      footerText.textContent =
        "Hecho con todo mi cariño, especialmente para mi Marcita bonita. 💗";

      for (let i = 0; i < 18; i++) {
        setTimeout(createHeart, i * 100);
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";

      const hearts = ["💗", "💕", "💖", "💘", "🌸", "✨", "🩷"];
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      heart.style.fontSize = (16 + Math.random() * 22) + "px";

      document.body.appendChild(heart);

      setTimeout(function () {
        heart.remove();
      }, 6500);
    }

    setInterval(createHeart, 900);
  </script>

</body>
</html>
